name: Ubuntu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ubuntu:
    env:
      build_type: "Release"
    strategy:
      fail-fast: false
      matrix:
        # Explicitly enumerated (not a `backend: [...]` axis crossed against `include:`) —
        # GitHub Actions only cross-products `include:` entries against other matrix axes
        # when they share a key with that axis; since these entries don't set `backend`,
        # a separate `backend:` axis silently collapses to just the last `include` entry
        # merged onto each backend value, dropping the other three compilers entirely.
        include:
          - name: "Ubuntu 22.04 + GCC-10"
            os: ubuntu-22.04
            compiler: gcc
            version: "10"
            backend: vulkan
          - name: "Ubuntu 22.04 + GCC-10"
            os: ubuntu-22.04
            compiler: gcc
            version: "10"
            backend: webgpu
          - name: "Ubuntu 22.04 + GCC-11"
            os: ubuntu-22.04
            compiler: gcc
            version: "11"
            backend: vulkan
          - name: "Ubuntu 22.04 + GCC-11"
            os: ubuntu-22.04
            compiler: gcc
            version: "11"
            backend: webgpu
          - name: "Ubuntu 22.04 + Clang-11"
            os: ubuntu-22.04
            compiler: clang
            version: "11"
            backend: vulkan
          - name: "Ubuntu 22.04 + Clang-11"
            os: ubuntu-22.04
            compiler: clang
            version: "11"
            backend: webgpu
          - name: "Ubuntu 22.04 + Clang-12"
            os: ubuntu-22.04
            compiler: clang
            version: "12"
            backend: vulkan
          - name: "Ubuntu 22.04 + Clang-12"
            os: ubuntu-22.04
            compiler: clang
            version: "12"
            backend: webgpu
          # Ray-query coverage, not compiler coverage. 22.04's mesa-vulkan-drivers is Mesa
          # 23.2.x, whose lavapipe predates VK_KHR_ray_query; that arrived in Mesa 24.1, and
          # 24.04 now carries 25.x through updates. This is the only job where Vulkan ray
          # tracing can run at all, so it exists for Phase 5's gate rather than to widen the
          # compiler matrix. It is *added* to the 22.04 entries rather than replacing them:
          # noble ships neither gcc-10/11 nor clang-11/12, and those are the compiler floor
          # this project supports.
          - name: "Ubuntu 24.04 + GCC-13 (lavapipe ray query)"
            os: ubuntu-24.04
            compiler: gcc
            version: "13"
            backend: vulkan

    runs-on: ${{matrix.os}}
    name: ${{matrix.name}} (${{ matrix.backend }})

    steps:
      - uses: actions/checkout@v1
        with:
          submodules: true
      - name: Install Dependency
        run: |
          # Only 22.04 needs it, and it has no noble series -- adding it there makes every
          # later apt-get warn about a missing release file.
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          fi
          sudo apt-get update && sudo apt-get upgrade && sudo apt-get dist-upgrade
          sudo apt-get install xorg-dev build-essential libgl-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxkbcommon-dev libwayland-dev libwayland-bin wayland-protocols python3-setuptools xvfb
          if [ "${{ matrix.backend }}" = "vulkan" ]; then
            sudo apt-get install mesa-vulkan-drivers
          fi
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install cmake gcc-${{ matrix.version }} g++-${{ matrix.version }}
          else
            sudo apt-get install cmake clang-${{ matrix.version }} clang++-${{ matrix.version }}
          fi
      - name: Configure Compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc-${{ matrix.version }}" >> $GITHUB_ENV
            echo "CXX=g++-${{ matrix.version }}" >> $GITHUB_ENV
          else
            echo "CC=clang-${{ matrix.version }}" >> $GITHUB_ENV
            echo "CXX=clang++-${{ matrix.version }}" >> $GITHUB_ENV
          fi
      - name: Install Vulkan SDK
        if: matrix.backend == 'vulkan'
        run: |
          UBUNTU_CODENAME="$(lsb_release -cs)"
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO "/etc/apt/sources.list.d/lunarg-vulkan-${UBUNTU_CODENAME}.list" \
            "https://packages.lunarg.com/vulkan/lunarg-vulkan-${UBUNTU_CODENAME}.list"
          sudo apt-get update -qq
          sudo apt-get install -y vulkan-sdk || {
            echo "NOTE: vulkan-sdk not available for this Ubuntu release via LunarG repo."
            echo "      Falling back to distro Vulkan packages."
            sudo apt-get install -y libvulkan-dev vulkan-tools vulkan-validationlayers-dev
          }
      - name: Execute bootstrap script
        shell: bash
        run: |
          # dawn is only needed for vkm-compiler's optional WGSL output
          # (VKM_COMPILER_ENABLE_WGSL, off by default and unused by CI); skip it
          # to avoid an unnecessary, disk-heavy clone on every job.
          python3 bootstrap.py --skip dawn
      - name: Build and run unit tests (${{ matrix.backend }} backend)
        # The vulkan backend's tests create a real GLFW window, which needs a real X server
        # even for an invisible window; headless runners have no display at all, so xvfb-run
        # provides a virtual framebuffer for it. The webgpu backend runs headlessly in Chrome
        # instead and doesn't need this.
        #
        # Hosted runners have no GPU, so vkCreateInstance would fail against a hardware ICD;
        # mesa-vulkan-drivers installs lavapipe (a software Vulkan implementation), and both
        # VK_DRIVER_FILES (current loader env var) and the legacy VK_ICD_FILENAMES alias point
        # the Vulkan loader at its ICD manifest so it's picked up regardless of loader version.
        run: |
          if [ "${{ matrix.backend }}" = "vulkan" ]; then
            # Searched rather than hardcoded, and fatal when empty. `ls` on one fixed path
            # printed an error to stderr and exported an empty VK_DRIVER_FILES, which makes
            # every device test skip through VKM_REQUIRE_DEVICE while the job still reports
            # success -- that is exactly how the 24.04 runner passed 208 tests without running
            # a single Vulkan one. A job that cannot find a driver must fail, not pass quietly.
            icd="$(find /usr/share/vulkan/icd.d /usr/lib/*/vulkan/icd.d /usr/local/share/vulkan/icd.d \
                   -name 'lvp_icd*.json' 2>/dev/null | tr '\n' ':')"
            if [ -z "$icd" ]; then
              echo "ERROR: no lavapipe ICD manifest found; every Vulkan test would skip."
              echo "mesa-vulkan-drivers installed these instead:"
              dpkg -L mesa-vulkan-drivers | grep -iE 'icd|\.json' || true
              exit 1
            fi
            echo "Using lavapipe ICD: $icd"
            export VK_DRIVER_FILES="$icd"
            export VK_ICD_FILENAMES="$icd"
            # Run the suite twice on the ray-query job and judge the second.
            #
            # lavapipe segfaults inside vkCmdBuildAccelerationStructuresKHR when Mesa's on-disk
            # shader cache is cold -- it compiles the internal shaders it builds acceleration
            # structures with on first use, and crashes while doing so. Measured, not guessed:
            # with MESA_SHADER_CACHE_DISABLE=true set, every invocation crashed, including a
            # direct one, and it moved to the very first acceleration structure test. With the
            # cache left alone, only the first invocation crashes and every later one passes all
            # 222 cases with 9199 assertions. Nothing in the crash is ours: no validation error,
            # no engine log, no unfreed allocation, and every filtered ordering of those tests
            # passes.
            #
            # So the first invocation is a cache warm-up whose result is reported and ignored,
            # and the second decides the job. It runs every test, so a real regression still
            # fails here -- the only thing this hides is a failure that needs a cold shader
            # cache to reproduce, which is the driver defect itself. TODO.md carries it.
            #
            # Only the ray-query job needs it. The 22.04 Vulkan jobs run a lavapipe without
            # VK_KHR_ray_query, so they never build an acceleration structure and cannot reach
            # the crash; running the suite twice there would only cost CI time.
            if [ "${{ matrix.os }}" = "ubuntu-24.04" ]; then
              echo "=== warm-up run (result ignored; populates Mesa's shader cache)"
              xvfb-run -a python3 scripts/run_tests.py --no-bootstrap --build-type ${{env.build_type}} --backend ${{ matrix.backend }} \
                && echo "=== warm-up exit: 0" || echo "=== warm-up exit: $?"
            fi
            echo "=== judged run"
            xvfb-run -a python3 scripts/run_tests.py --no-bootstrap --build-type ${{env.build_type}} --backend ${{ matrix.backend }}
          else
            python3 scripts/run_tests.py --no-bootstrap --build-type ${{env.build_type}} --backend ${{ matrix.backend }}
          fi
